spring.application.name=backend_meal

server.port=8080

# ─── IA (variables d'environnement OS — jamais de clé en dur) ────────────────
ai.provider=${AI_PROVIDER:dynamic}
ai.api-url=${AI_API_URL:https://api.openai.com/v1}
ai.api-key=${AI_API_KEY:}
ai.model=${AI_MODEL:gpt-4o-mini}

# ─── MySQL ────────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/backend_meal?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── Hibernate / JPA ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# ─── Jackson (IDs Angular = string, dates ISO-8601) ───────────────────────────
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.time-zone=UTC

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.example.backend_meal=INFO
logging.level.org.hibernate.SQL=WARN

# ─── CORS ─────────────────────────────────────────────────────────────────────
spring.web.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,http://localhost:4000}
